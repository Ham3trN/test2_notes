<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Min Anteckning">
  
  <title>Min Lokala Anteckning</title>
  
  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      padding: 20px;
      padding-top: env(safe-area-inset-top);
    }
    
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    
    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      color: #e94560;
    }
    
    .status {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 20px;
    }
    
    textarea {
      width: 100%;
      height: 250px;
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 12px;
      color: #eee;
      padding: 16px;
      font-size: 1.1rem;
      resize: vertical;
      outline: none;
    }
    
    textarea:focus {
      border-color: #e94560;
    }
    
    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    
    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    
    .save {
      background: #e94560;
      color: white;
    }
    
    .clear {
      background: #0f3460;
      color: #ccc;
    }
    
    .info {
      margin-top: 30px;
      padding: 16px;
      background: #16213e;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #aaa;
    }
    
    .info strong {
      color: #e94560;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Min Lokala Anteckning</h1>
    <div class="status" id="status">Laddar...</div>
    
    <textarea id="note" placeholder="Skriv något här..."></textarea>
    
    <div class="buttons">
      <button class="save" onclick="saveNote()">Spara nu</button>
      <button class="clear" onclick="clearNote()">Rensa</button>
    </div>
    
    <div style="margin-top: 30px; text-align: center;">
  <img src="anteckningsblock.jpg" alt="Anteckningsblock" style="width: 100%; max-width: 340px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.3);">
</div>
  </div>

  <script>
    const noteEl = document.getElementById('note');
    const statusEl = document.getElementById('status');

    // Ladda sparad text
    const saved = localStorage.getItem('myNote');
    if (saved) {
      noteEl.value = saved;
      statusEl.textContent = 'Laddade sparad anteckning';
    } else {
      statusEl.textContent = 'Ingen sparad anteckning ännu';
    }

    // Spara automatiskt medan man skriver
    noteEl.addEventListener('input', () => {
      localStorage.setItem('myNote', noteEl.value);
      statusEl.textContent = 'Sparad automatiskt ✓';
    });

    function saveNote() {
      localStorage.setItem('myNote', noteEl.value);
      statusEl.textContent = 'Manuellt sparad ✓';
    }

    function clearNote() {
      if (confirm('Vill du rensa anteckningen?')) {
        noteEl.value = '';
        localStorage.removeItem('myNote');
        statusEl.textContent = 'Rensad';
      }
    }

    // Registrera Service Worker (för offline)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker registrerad'))
        .catch(err => console.log('SW fel:', err));
    }
  </script>
</body>
</html>
